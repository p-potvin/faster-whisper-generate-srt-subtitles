[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultwares-media-processing"
version = "0.1.0"
description = "High-Performance Video Transcription & Multi-Language Translation Tool"
authors = [{ name = "VaultWares Team" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pyside6",
    "tqdm",
    "colorama",
]

[tool.pytest.ini_options]
testpaths = ["tests", "vaultwares_media_processing"]
pythonpath = ["."]
addopts = "--ignore=vaultwares-adk --ignore=vaultwares-themes"

[tool.setuptools.packages.find]
include = ["vaultwares_media_processing*"]

